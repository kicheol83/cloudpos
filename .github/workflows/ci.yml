name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      gateway: ${{ steps.filter.outputs.gateway }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'contracts/**'
              - 'libs/**'
              - 'buildSrc/**'
              - 'gradle/**'
              - '*.gradle.kts'
            identity:
              - 'services/identity/**'
            gateway:
              - 'services/gateway/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, gateway]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.identity == 'true' || needs.changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :services:${{ matrix.service }}:build
