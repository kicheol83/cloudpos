name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'contracts/**'
              - 'libs/**'
              - 'buildSrc/**'
              - 'gradle/**'
              - '*.gradle.kts'
            services:
              - 'services/**'

      - id: matrix
        run: |
          ALL=$(ls services | jq -R -s -c 'split("\n")[:-1]')
          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.filter.outputs.services }}" != "true" ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- services \
            | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$CHANGED" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :services:${{ matrix.service }}:build
